<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Network GIS Portal</title>

    <!-- Google Fonts & Font Awesome -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
    />

    <!-- External Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="brand-header">
          <i class="fa-solid fa-network-wired"></i>
          <h2>NETGIS Enterprise</h2>
        </div>

        <nav class="nav-menu">
          <div class="nav-section-title">Core Modules</div>
          <a class="nav-item active"
            ><i class="fa-solid fa-map-location-dot"></i
            ><span>Fiber Coverage Map</span></a
          >
          <a class="nav-item" onclick="alert('Modul Asset Inventory')"
            ><i class="fa-solid fa-boxes-stacked"></i
            ><span>Asset Inventory</span></a
          >
          <a class="nav-item" onclick="alert('Modul NOC Incident')"
            ><i class="fa-solid fa-triangle-exclamation"></i
            ><span>NOC Monitor</span></a
          >
          <div class="nav-section-title">Sales & System</div>
          <a class="nav-item" onclick="alert('Modul Coverage Checker')"
            ><i class="fa-solid fa-user-plus"></i
            ><span>Coverage Checker</span></a
          >
          <a class="nav-item" onclick="alert('Modul Access Control')"
            ><i class="fa-solid fa-users-gear"></i
            ><span>Access Control</span></a
          >
        </nav>
      </aside>

      <main class="main-wrapper">
        <header class="top-header">
          <div class="header-title">
            <h3>Centralized Asplan Portal</h3>
            <p>Area Coverage: Banjarmasin & Regional Backbone</p>
          </div>
          <div class="status-badge">
            <div class="status-pulse"></div>
            <span>GIS Database: Connected</span>
          </div>
        </header>

        <div class="map-viewport">
          <div class="metrics-overlay">
            <div class="metric-card">
              <div class="metric-icon purple">
                <i class="fa-solid fa-microchip"></i>
              </div>
              <div class="metric-data">
                <h4 id="stat-odp">0</h4>
                <span>Total ODP</span>
              </div>
            </div>
            <div class="metric-card">
              <div class="metric-icon blue">
                <i class="fa-solid fa-route"></i>
              </div>
              <div class="metric-data">
                <h4 id="stat-cables">0</h4>
                <span>Jalur Kabel</span>
              </div>
            </div>
            <div class="metric-card">
              <div class="metric-icon red">
                <i class="fa-solid fa-circle-exclamation"></i>
              </div>
              <div class="metric-data">
                <h4 id="stat-incidents">0</h4>
                <span>Incident</span>
              </div>
            </div>
          </div>

          <div id="map"></div>
        </div>
      </main>
    </div>

    <!-- Leaflet JS Libraries -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- External Custom JS Logic -->
    <script src="app.js"></script>
  </body>
</html>
